# Postgres de UMA cópia do Balcão. O `npm run up` sobe um projeto compose por cópia
# (-p balcao-<cópia>), com porta e banco próprios. Sem o harness, os padrões abaixo valem.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: ${BALCAO_DB_NAME:-balcao}
    ports:
      - "${BALCAO_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
